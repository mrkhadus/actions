name: project1
on: 
  push:
    branches:
      - "main"
    paths:
      - "project1/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Get code

      - name: install NodeJS # Node is already installed in the agent ubuntu-latest just exploring actions
        uses: actions/setup-node@v6
        with:
          node-version: 18
      
      - name: Install Dependencies
        run: npm ci --prefix project1

      - name: Test Code
        run: |
          cd project1
          npm test 
    