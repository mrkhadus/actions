name: tflint
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: string

jobs:
  checkout: 
    runs-on: ubuntu-latest

    env:
      AZDO_PERSONAL_ACCESS_TOKEN: ${{ secrets.ADO_TOKEN }}
      TF_VAR_environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v6
        name: Setup TFLint
        with:
          tflint_version: v0.52.0
          cache: true
      
      - name: Initialize TFLint
        working-directory: ./terraform
        run: tflint --init

      - name: Run TFLint
        working-directory: ./terraform
        run: tflint
      
      - uses: hashicorp/setup-terraform@v4

      - name: Run Tf init
        working-directory: ./terraform
        run: terraform init

      - name: Run TF plan
        working-directory: ./terraform
        run: |
          terraform plan -var="environment=${{ inputs.environment || 'dev' }}" -out=tfplan
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment || 'dev' }}
          path: |
            ./terraform/tfplan
            ./terraform/tfplan.txt
